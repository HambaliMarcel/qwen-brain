[project]
name = "qwen-brain"
version = "0.1.0"
description = "Local Qwen3.5-4B voice brain: live Qwen3-ASR in, streamed text out."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
qwen-brain = "qwen_brain.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_backend"

[tool.setuptools.packages.find]
include = ["qwen_brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
